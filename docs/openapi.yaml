openapi: 3.0.3
info:
  title: API de Sistema de Biblioteca e Empréstimos
  description: Especificação da API do fluxo principal de empréstimos de livros.
  version: 1.0.0
paths:
  /emprestimos:
    post:
      summary: Realiza o empréstimo de um livro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [livroId, usuarioId]
              properties:
                livroId:
                  type: string
                usuarioId:
                  type: string
      responses:
        '201':
          description: Empréstimo criado com sucesso
        '400':
          description: Livro indisponível ou usuário com pendências
  /emprestimos/{id}/devolucao:
    post:
      summary: Registra a devolução de um livro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Devolução concluída com sucesso
        '404':
          description: Empréstimo não encontrado
